[build]
  publish = "static"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.10"

# Route API requests to the Python serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Direct access fallback for functions
[[redirects]]
  from = "/.netlify/functions/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side SPA routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
